<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frameline — Sports Photography Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C1A17; --ink-soft:#4A453E; --paper:#F1F0EC; --card:#FFFFFF;
    --line:#DEDBD3; --line-strong:#C9C5BB;
    --safelight:#9E2B25; --amber:#B9791E; --slate:#5B6B73; --olive:#5E7350; --violet:#6E5AA0;
    --muted:#8C867B; --ai:#3F6F8F;
    --shadow:0 1px 2px rgba(28,26,23,.06), 0 8px 24px rgba(28,26,23,.05);
    --display:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:'Space Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:var(--body);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:var(--body);font-size:14px;}
  ::selection{background:var(--safelight);color:#fff;}
  a{color:inherit;}

  .app{display:grid;grid-template-columns:236px 1fr;min-height:100vh;}
  .sidebar{background:var(--ink);color:#E9E6DF;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto;}
  .brand{display:flex;align-items:center;gap:11px;padding:4px 6px 18px;}
  .aperture{width:28px;height:28px;flex:none;}
  .brand-name{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.01em;line-height:1.1;}
  .brand-name span{display:block;font-family:var(--mono);font-weight:400;font-size:8.5px;letter-spacing:.2em;color:#8E887C;margin-top:3px;}
  .ai-chip{display:flex;align-items:center;gap:7px;margin:0 6px 14px;padding:7px 10px;border-radius:8px;background:rgba(63,111,143,.16);border:1px solid rgba(63,111,143,.3);font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:#9DC3DC;}
  .ai-chip .pulse{width:7px;height:7px;border-radius:50%;background:#5FA8D3;animation:pulse 2.4s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,168,211,.5);}70%{box-shadow:0 0 0 6px rgba(95,168,211,0);}100%{box-shadow:0 0 0 0 rgba(95,168,211,0);}}
  .nav{display:flex;flex-direction:column;gap:2px;}
  .nav-label{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:#6F6A60;padding:14px 12px 6px;}
  .nav-btn{display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;color:#B4AEA3;padding:9px 12px;border-radius:8px;text-align:left;font-size:14px;font-weight:500;transition:.12s;position:relative;}
  .nav-btn:hover{background:rgba(255,255,255,.05);color:#F4F1EA;}
  .nav-btn.active{background:var(--safelight);color:#fff;}
  .nav-btn.ai.active{background:var(--ai);}
  .nav-btn .ic{width:17px;height:17px;flex:none;opacity:.92;}
  .nav-btn .badge-dot{margin-left:auto;font-family:var(--mono);font-size:10px;background:rgba(255,255,255,.14);color:#E9E6DF;border-radius:10px;padding:1px 7px;}
  .nav-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding-top:12px;}
  .nav-foot .nav-btn{font-size:12.5px;color:#827C71;padding:7px 12px;}
  .nav-foot .nav-btn:hover{color:#C9C3B8;}

  .main{min-width:0;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;gap:16px;padding:18px 30px;border-bottom:1px solid var(--line);background:rgba(241,240,236,.85);backdrop-filter:blur(6px);position:sticky;top:0;z-index:20;}
  .crumb{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em;margin-bottom:2px;}
  .crumb a{color:var(--safelight);text-decoration:none;cursor:pointer;}
  .view-title{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.01em;}
  .topbar-spacer{flex:1;}
  .search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 12px;width:230px;}
  .search:focus-within{border-color:var(--line-strong);box-shadow:0 0 0 3px rgba(28,26,23,.05);}
  .search input{border:none;outline:none;background:none;width:100%;}
  .search .ic{width:15px;height:15px;color:var(--muted);flex:none;}

  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:9px;font-weight:600;font-size:13.5px;transition:.12s;}
  .btn:hover{border-color:var(--ink-soft);}
  .btn-primary{background:var(--safelight);border-color:var(--safelight);color:#fff;}
  .btn-primary:hover{background:#8A241F;border-color:#8A241F;}
  .btn-ai{background:var(--ai);border-color:var(--ai);color:#fff;}
  .btn-ai:hover{background:#345C77;border-color:#345C77;}
  .btn .ic{width:15px;height:15px;}
  .btn-sm{padding:6px 10px;font-size:12.5px;border-radius:7px;}
  .btn-ghost{border-color:transparent;background:none;color:var(--ink-soft);}
  .btn-ghost:hover{background:rgba(28,26,23,.05);color:var(--ink);}

  .content{padding:26px 30px 56px;overflow:auto;}

  .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:13px;margin-bottom:26px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow);}
  .stat-label{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
  .stat-num{font-family:var(--display);font-size:27px;font-weight:600;letter-spacing:-.02em;margin-top:7px;line-height:1;}
  .stat-num .cur{font-size:15px;color:var(--ink-soft);}
  .stat-foot{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
  .stat-foot.alert{color:var(--safelight);font-weight:600;}

  .section-head{display:flex;align-items:baseline;gap:12px;margin:4px 0 13px;}
  .section-head h2{font-family:var(--display);font-size:15px;font-weight:600;margin:0;}
  .section-head .rule{flex:1;height:1px;background:var(--line);}
  .section-head .count{font-family:var(--mono);font-size:11px;color:var(--muted);}

  .two-col{display:grid;grid-template-columns:1fr 360px;gap:22px;align-items:start;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;}
  .panel-head{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;}
  .panel-head h3{font-family:var(--display);font-size:13.5px;font-weight:600;margin:0;}

  .row-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;}
  .row-item:last-child{border-bottom:none;}
  .row-item:hover{background:#FAFAF7;}
  .avatar{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:12px;color:#fff;background:var(--ink-soft);}
  .avatar.sport{border-radius:50%;}
  .ri-main{min-width:0;flex:1;}
  .ri-title{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ri-sub{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:1px;}
  .ri-right{font-family:var(--mono);font-size:12px;text-align:right;color:var(--ink-soft);}

  .ai-card{background:linear-gradient(160deg,#22323D,#1A2730);border:1px solid #2C4150;border-radius:14px;padding:18px 18px 16px;color:#DCE6EC;box-shadow:var(--shadow);}
  .ai-card-head{display:flex;align-items:center;gap:9px;margin-bottom:4px;}
  .ai-card-head .spark{width:18px;height:18px;color:#7FB8DC;}
  .ai-card-head h3{font-family:var(--display);font-size:14px;font-weight:600;margin:0;color:#EAF2F7;}
  .ai-card .sub{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:#7E97A6;margin-bottom:14px;}
  .ai-insight{display:flex;gap:11px;padding:11px 0;border-top:1px solid rgba(255,255,255,.08);font-size:13.5px;line-height:1.45;}
  .ai-insight .idx{font-family:var(--mono);font-size:11px;color:#6FA9CE;flex:none;padding-top:1px;}
  .ai-empty{font-size:13px;color:#9DB2BE;padding:6px 0 12px;}

  .pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:20px;font-weight:700;}
  .dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .p-prospect{background:#EAEEF0;color:#41535C;} .p-prospect .dot{background:var(--slate);}
  .p-active{background:#E7F0E5;color:#3C5132;} .p-active .dot{background:var(--olive);}
  .p-renewal{background:#F6EEDD;color:#7A5610;} .p-renewal .dot{background:var(--amber);}
  .p-expired{background:#F3E6E5;color:#7E2520;} .p-expired .dot{background:var(--safelight);}
  .p-scheduled{background:#EAEEF0;color:#41535C;} .p-scheduled .dot{background:var(--slate);}
  .p-confirmed{background:#F6EEDD;color:#7A5610;} .p-confirmed .dot{background:var(--amber);}
  .p-completed{background:#E7F0E5;color:#3C5132;} .p-completed .dot{background:var(--olive);}
  .p-cancelled{background:#ECEAE3;color:#6A6458;} .p-cancelled .dot{background:var(--muted);}
  .p-processing{background:#F6EEDD;color:#7A5610;} .p-processing .dot{background:var(--amber);}
  .p-ready{background:#EAEEF0;color:#41535C;} .p-ready .dot{background:var(--slate);}
  .p-delivered{background:#E7F0E5;color:#3C5132;} .p-delivered .dot{background:var(--olive);}
  .p-paid{background:#E7F0E5;color:#3C5132;} .p-paid .dot{background:var(--olive);}
  .p-unpaid{background:#F3E6E5;color:#7E2520;} .p-unpaid .dot{background:var(--safelight);}
  .p-draft{background:#F6EEDD;color:#7A5610;} .p-draft .dot{background:var(--amber);}
  .p-sent{background:#EAEEF0;color:#41535C;} .p-sent .dot{background:var(--slate);}
  .p-signed{background:#E7F0E5;color:#3C5132;} .p-signed .dot{background:var(--olive);}

  .tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.04em;padding:2px 7px;border-radius:5px;background:#EFEDE6;color:var(--ink-soft);margin:1px 3px 1px 0;}

  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
  .acard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:var(--shadow);cursor:pointer;transition:.12s;}
  .acard:hover{border-color:var(--line-strong);transform:translateY(-2px);}
  .acard-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;}
  .acard-title{font-family:var(--display);font-size:16px;font-weight:600;line-height:1.2;}
  .acard-sub{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px;}
  .acard-stats{display:flex;gap:18px;border-top:1px solid var(--line);padding-top:13px;}
  .mini{font-family:var(--mono);}
  .mini .n{font-size:17px;font-weight:700;font-family:var(--display);}
  .mini .l{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:1px;}

  .gthumb{height:120px;border-radius:9px;margin-bottom:13px;position:relative;overflow:hidden;background:#2b2620;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:2px;}
  .gthumb i,.gthumb img{display:block;width:100%;height:100%;object-fit:cover;border-radius:2px;background:linear-gradient(135deg,#3d362c,#514838);}
  .gthumb .ai-badge{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:9px;letter-spacing:.08em;background:rgba(63,111,143,.92);color:#fff;padding:3px 7px;border-radius:20px;display:flex;align-items:center;gap:4px;}
  .gthumb .gcount{position:absolute;bottom:8px;left:9px;font-family:var(--mono);font-size:11px;color:#EDE7DA;background:rgba(28,26,23,.6);padding:3px 8px;border-radius:6px;}

  .table-wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
  table{width:100%;border-collapse:collapse;}
  thead th{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);font-weight:700;background:#FAFAF7;}
  tbody td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.clk{cursor:pointer;} tbody tr.clk:hover{background:#FAFAF7;}
  .cell-name{display:flex;align-items:center;gap:11px;font-weight:600;}
  .cell-mono{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);}

  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .seg{display:inline-flex;background:#E7E5DE;border-radius:9px;padding:3px;}
  .seg button{border:none;background:none;padding:7px 14px;border-radius:7px;font-weight:600;font-size:13px;color:var(--ink-soft);}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);}

  .sched-row{display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 18px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;}
  .sched-row:hover{border-color:var(--line-strong);}
  .date-chip{text-align:center;border-right:1px solid var(--line);padding-right:14px;}
  .date-chip .mon{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--safelight);font-weight:700;}
  .date-chip .day{font-family:var(--display);font-size:24px;font-weight:600;line-height:1;}
  .date-chip .yr{font-family:var(--mono);font-size:10px;color:var(--muted);}
  .sched-main .stitle{font-family:var(--display);font-weight:600;font-size:15.5px;}
  .sched-main .smeta{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);margin-top:3px;display:flex;gap:14px;flex-wrap:wrap;}

  /* calendar */
  .cal-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .cal-title{font-family:var(--display);font-size:18px;font-weight:600;min-width:200px;}
  .cal-grid{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);background:#FAFAF7;border-bottom:1px solid var(--line);}
  .cal-dow div{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:10px;text-align:center;font-weight:700;}
  .cal-body{display:grid;grid-template-columns:repeat(7,1fr);}
  .cal-cell{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px;cursor:pointer;position:relative;}
  .cal-cell:nth-child(7n){border-right:none;}
  .cal-cell:hover{background:#FAFAF7;}
  .cal-cell.dim{background:#F6F5F1;color:var(--muted);}
  .cal-cell.today .cal-num{background:var(--safelight);color:#fff;}
  .cal-num{font-family:var(--mono);font-size:11px;font-weight:700;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;}
  .cal-ev{font-size:10.5px;font-family:var(--mono);background:#EFEDE6;border-left:3px solid var(--slate);padding:3px 5px;border-radius:4px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
  .ev-shoot{border-left-color:var(--safelight);} .ev-meeting{border-left-color:var(--slate);} .ev-call{border-left-color:var(--violet);} .ev-task{border-left-color:var(--olive);} .ev-other{border-left-color:var(--amber);}
  .ev-done{opacity:.5;text-decoration:line-through;}
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
  .wk-col{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:200px;padding:8px;box-shadow:var(--shadow);}
  .wk-col.today{border-color:var(--safelight);}
  .wk-h{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:8px;}
  .wk-h b{display:block;font-family:var(--display);font-size:17px;color:var(--ink);}
  .cal-day{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;}
  .day-ev{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;border-left:4px solid var(--slate);}
  .day-ev:hover{background:#FAFAF7;}
  .day-ev .t{font-family:var(--mono);font-size:12px;color:var(--ink-soft);width:74px;flex:none;}
  .day-ev .lbl{font-weight:600;}
  .day-ev .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:auto;}

  /* tabs */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow:auto;}
  .tabs button{border:none;background:none;padding:11px 14px;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;}
  .tabs button:hover{color:var(--ink);}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--safelight);}
  .tabs .tcount{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:5px;}

  /* detail hero */
  .detail-hero{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow);margin-bottom:22px;display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;}
  .detail-hero .badge{width:54px;height:54px;border-radius:13px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;color:#fff;background:var(--safelight);flex:none;}
  .dh-main{flex:1;min-width:200px;}
  .dh-name{font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:-.01em;}
  .dh-sub{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:3px;}
  .dh-contract{display:flex;gap:22px;margin-top:14px;flex-wrap:wrap;}
  .dh-c .l{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .dh-c .v{font-family:var(--mono);font-size:14px;font-weight:700;margin-top:2px;}
  .dh-actions{display:flex;flex-direction:column;gap:8px;}

  .team-block{background:var(--card);border:1px solid var(--line);border-radius:11px;margin-bottom:11px;overflow:hidden;box-shadow:var(--shadow);}
  .team-head{display:flex;align-items:center;gap:13px;padding:14px 16px;cursor:pointer;}
  .team-head:hover{background:#FAFAF7;}
  .team-name{font-family:var(--display);font-weight:600;font-size:15px;}
  .team-sub{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:1px;}
  .chev{margin-left:auto;color:var(--muted);transition:transform .15s;width:16px;height:16px;}
  .team-block.open .chev{transform:rotate(90deg);}
  .roster{display:none;border-top:1px solid var(--line);}
  .team-block.open .roster{display:block;}
  .athlete-row{display:flex;align-items:center;gap:12px;padding:10px 16px 10px 56px;border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer;}
  .athlete-row:last-child{border-bottom:none;}
  .athlete-row:hover{background:#FAFAF7;}
  .jersey{font-family:var(--mono);font-weight:700;font-size:12px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#EFEDE6;color:var(--ink-soft);flex:none;}
  .ath-name{font-weight:600;flex:1;}
  .ath-parent{font-family:var(--mono);font-size:10.5px;color:var(--muted);}
  .roster-add{padding:10px 16px 12px 56px;}

  .doc-row{display:flex;align-items:center;gap:13px;padding:13px 16px;border-bottom:1px solid var(--line);}
  .doc-row:last-child{border-bottom:none;}

  @media (max-width:1100px){.stats{grid-template-columns:repeat(3,1fr);} .two-col,.set-grid{grid-template-columns:1fr;} .cal-week{grid-template-columns:repeat(7,1fr);overflow-x:auto;}}

<script>
/* ===== Storage adapter ===== */
const Store=(()=>{const mem={};const hasWS=typeof window!=='undefined'&&window.storage&&typeof window.storage.get==='function';
  async function get(key){if(hasWS){try{const r=await window.storage.get(key);return r?JSON.parse(r.value):null;}catch(e){return null;}}try{const v=localStorage.getItem(key);return v?JSON.parse(v):null;}catch(e){return mem[key]||null;}}
  async function set(key,d){const s=JSON.stringify(d);if(hasWS){try{await window.storage.set(key,s);return true;}catch(e){return false;}}try{localStorage.setItem(key,s);return true;}catch(e){mem[key]=d;return false;}}
  return{get,set};})();
const MAIN='frameline:v3', PKEY=gid=>'frameline:photos:'+gid;

/* ===== State ===== */
let state={studio:'Frameline',profile:{email:'',phone:'',address:''},packages:[],schools:[],teams:[],athletes:[],pictureDays:[],galleries:[],orders:[],appointments:[],tasks:[],documents:[],emails:[],templates:[],inquiries:[],integrations:{gmail:{connected:false,email:'',connectedAt:''},ai:{provider:'claude-builtin',hasKey:false}},onboarded:true};
let view='dashboard', query='', currentSchoolId=null, currentGalleryId=null, clientTab='overview', mailTab='inbox';
let calMode='month', calCursor=new Date();
const expandedTeams=new Set();
let chat=[], chatBusy=false, lastInsights=null;
const galleryPhotos={};

const SPORTS=['Football','Basketball','Soccer','Baseball','Softball','Volleyball','Track & Field','Wrestling','Swimming','Tennis','Lacrosse','Cheer','Cross Country','Hockey','Gymnastics','Other'];
const SEASONS=['Fall','Winter','Spring','Summer'];
const CONTRACT_STATUS=['prospect','active','renewal','expired'];
const PD_STATUS=['scheduled','confirmed','completed','cancelled'];
const GAL_STATUS=['processing','ready','delivered'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const APPT_TYPES=['meeting','call','shoot','other'];
const DOC_TYPES=['Contract','Proposal','Agreement','Model Release','Other'];
const DOC_STATUS=['draft','sent','signed'];
const TPL_AUDIENCE=['School / AD','Coach','Parents','Athlete','General','Contract'];
const DEFAULT_PACKAGES=[['Pose Pack A',35],['Pose Pack B',45],['Team + Individual',65],['Digital Bundle',45],['Memory Mate',30],['Buddy Print',25],['Senior Banner',120],['Custom',0]];

/* ===== Helpers ===== */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$'+(Number(n)||0).toLocaleString('en-US');
const initials=n=>(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const todayISO=()=>new Date().toISOString().slice(0,10);
const schoolById=id=>state.schools.find(s=>s.id===id);
const teamById=id=>state.teams.find(t=>t.id===id);
const galById=id=>state.galleries.find(g=>g.id===id);
const teamsOf=sid=>state.teams.filter(t=>t.schoolId===sid);
const athletesOf=tid=>state.athletes.filter(a=>a.teamId===tid);
const athletesOfSchool=sid=>state.athletes.filter(a=>teamsOf(sid).some(t=>t.id===a.teamId));
const schoolName=id=>(schoolById(id)||{}).name||'Unknown';
const docsOf=sid=>state.documents.filter(d=>d.schoolId===sid&&d.type!=='Quote'&&d.type!=='Invoice');
const emailsOf=sid=>state.emails.filter(e=>e.schoolId===sid).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
const apptsOf=sid=>state.appointments.filter(a=>a.schoolId===sid);
const ordersOf=sid=>state.orders.filter(o=>o.schoolId===sid);
function fmtDate(iso){if(!iso)return{mon:'TBD',day:'—',yr:'',full:'Date TBD'};const d=new Date(iso+'T00:00');return{mon:d.toLocaleString('en-US',{month:'short'}).toUpperCase(),day:d.getDate(),yr:d.getFullYear(),full:d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'})};}
function fmtDT(iso){if(!iso)return'';const d=new Date(iso);return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}
const schoolRevenue=sid=>state.orders.filter(o=>o.schoolId===sid&&o.paid).reduce((t,o)=>t+(Number(o.amount)||0),0);
const schoolOutstanding=sid=>state.orders.filter(o=>o.schoolId===sid&&!o.paid).reduce((t,o)=>t+(Number(o.amount)||0),0);
const pkgPrice=name=>{const p=state.packages.find(p=>p.name===name);return p?p.price:0;};
const gmailOn=()=>state.integrations&&state.integrations.gmail&&state.integrations.gmail.connected;
async function save(){await Store.set(MAIN,state);if(Sync.authed&&Sync.online){try{await Sync.push();}catch(e){Sync.online=false;updateSyncChip();toast('Saved on this device — backend unreachable');}}}
async function sendEmailViaBackend({clientId,to,subject,body,attachments,localId}){
  if(!(Sync.authed&&Sync.online))return{sent:false,offline:true};
  try{
    const r=await Sync.api('/emails/send',{method:'POST',body:JSON.stringify({clientId:clientId||null,to,subject,body,attachments:attachments||[]})});
    if(localId){Sync.snap.emails=Sync.snap.emails||{};Sync.snap.emails[localId]=1;}
    return{sent:true,delivered:!!(r&&r.delivered),error:(r&&r.error)||'',note:(r&&r.note)||''};
  }catch(e){return{sent:true,delivered:false,error:(e&&e.message)||'send failed'};}
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}

/* ===== AI ===== */
async function callAI({system,messages,max_tokens=1024}){
  if(Sync.authed&&Sync.online){
    try{const d=await Sync.api('/ai/complete',{method:'POST',body:JSON.stringify({system,messages,max_tokens})});return (d.text||'').trim();}
    catch(e){/* fall through to direct call */}
  }
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens,system,messages})});
  if(!res.ok) throw new Error("AI HTTP "+res.status);
  const data=await res.json();
  return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
}
const askOnce=(system,user,mt)=>callAI({system,messages:[{role:'user',content:user}],max_tokens:mt});
function aiOffline(){$('#aiStatus').textContent='AI ENGINE · OFFLINE';}
function dataSummary(){
  const L=[`Studio: ${state.studio}`,`Packages: ${state.packages.map(p=>p.name+' $'+p.price).join(', ')}`,`Schools (${state.schools.length}):`];
  state.schools.forEach(s=>L.push(`- ${s.name} | contract ${s.contractStatus} ($${s.contractValue||0}, renews ${s.renewal||'n/a'}) | ${teamsOf(s.id).length} teams, ${athletesOfSchool(s.id).length} athletes | spent $${schoolRevenue(s.id)}, outstanding $${schoolOutstanding(s.id)} | contact ${s.contactName||'—'} ${s.contactEmail||''}`));
  const up=state.pictureDays.filter(p=>p.date&&p.date>=todayISO()&&p.status!=='cancelled').sort((a,b)=>a.date.localeCompare(b.date));
  L.push(`Upcoming picture days: `+(up.slice(0,8).map(p=>`${schoolName(p.schoolId)} ${p.date} (${p.status})`).join('; ')||'none'));
  L.push(`Open tasks: `+(state.tasks.filter(t=>!t.done).map(t=>t.title+(t.due?` (due ${t.due})`:'')).join('; ')||'none'));
  const paid=state.orders.filter(o=>o.paid).reduce((t,o)=>t+(+o.amount||0),0), out=state.orders.filter(o=>!o.paid).reduce((t,o)=>t+(+o.amount||0),0);
  L.push(`Orders: ${state.orders.length} total, $${paid} collected, $${out} outstanding`);
  return L.join('\n');
}

/* ===== Backend sync ===== */
const SYNC_RES=[
  {k:'schools',ep:'clients',m:{name:'name',district:'district',contactName:'contact_name',contactEmail:'contact_email',contactPhone:'contact_phone',contractStatus:'contract_status',contractValue:'contract_value',start:'start_date',renewal:'renewal_date',notes:'notes'}},
  {k:'teams',ep:'teams',m:{schoolId:'client_id',sport:'sport',season:'season',year:'year',coach:'coach',notes:'notes'}},
  {k:'athletes',ep:'athletes',m:{teamId:'team_id',name:'name',jersey:'jersey',grade:'grade',parentName:'parent_name',parentEmail:'parent_email',parentPhone:'parent_phone'}},
  {k:'pictureDays',ep:'picture-days',m:{schoolId:'client_id',date:'date',time:'time',location:'location',status:'status',teamIds:'team_ids',notes:'notes'}},
  {k:'packages',ep:'packages',m:{name:'name',price:'price'}},
  {k:'galleries',ep:'galleries',m:{name:'name',schoolId:'client_id',teamId:'team_id',status:'status',aiOrganized:'ai_organized',tags:'tags',notes:'notes',delivery:'delivery'}},
  {k:'orders',ep:'orders',m:{schoolId:'client_id',athleteName:'athlete_name',package:'package',amount:'amount',paid:'paid',date:'date',source:'source',selections:'selections'}},
  {k:'appointments',ep:'appointments',m:{schoolId:'client_id',title:'title',type:'type',date:'date',time:'time',durationMin:'duration_min',notes:'notes',done:'done'}},
  {k:'tasks',ep:'tasks',m:{schoolId:'client_id',title:'title',due:'due',priority:'priority',done:'done'}},
  {k:'documents',ep:'documents',m:{schoolId:'client_id',name:'name',type:'type',status:'status',date:'date',body:'body'}},
  {k:'templates',ep:'templates',m:{name:'name',audience:'audience',subject:'subject',body:'body'}},
  {k:'inquiries',ep:'inquiries',m:{name:'name',email:'email',phone:'phone',message:'message',status:'status',date:'created_at'}},
];
function toApi(res,rec){const o={id:rec.id};for(const sf in res.m)o[res.m[sf]]=rec[sf];return o;}
function fromApi(res,row){const rec={id:row.id};for(const sf in res.m)rec[sf]=row[res.m[sf]];return rec;}
function ser(o){return JSON.stringify(Object.keys(o).sort().reduce((a,k)=>{a[k]=o[k];return a;},{}));}

const Sync={
  base:(localStorage.getItem('frameline:api')||'http://localhost:4000').replace(/\/+$/,''),
  token:localStorage.getItem('frameline:token')||'',
  online:false,authed:false,busy:false,snap:{},
  setBase(u){this.base=(u||'').replace(/\/+$/,'');localStorage.setItem('frameline:api',this.base);},
  setToken(t){this.token=t;if(t)localStorage.setItem('frameline:token',t);else localStorage.removeItem('frameline:token');},
  async api(path,opts){opts=opts||{};const h={'Content-Type':'application/json',...(opts.headers||{})};if(this.token)h.Authorization='Bearer '+this.token;
    const r=await fetch(this.base+path,{...opts,headers:h});const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||r.statusText),{status:r.status});return d;},
  async connect(){try{const r=await fetch(this.base+'/health');if(!r.ok)throw 0;this.online=true;}catch(e){this.online=false;this.authed=false;updateSyncChip();return;}
    if(this.token){try{await this.api('/me');this.authed=true;await this.pull();}catch(e){this.authed=false;}}
    updateSyncChip();},
  async login(email,password){const d=await this.api('/auth/login',{method:'POST',body:JSON.stringify({email,password})});this.setToken(d.token);this.online=true;this.authed=true;await this.pull();updateSyncChip();},
  async register(email,password,studio){const d=await this.api('/auth/register',{method:'POST',body:JSON.stringify({email,password,studio})});this.setToken(d.token);this.online=true;this.authed=true;this.snap={};this.snap.emails={};await this.push();updateSyncChip();},
  signOut(){this.setToken('');this.authed=false;updateSyncChip();},
  takeSnap(){this.snap={};for(const res of SYNC_RES){const mp={};(state[res.k]||[]).forEach(rec=>mp[rec.id]=ser(toApi(res,rec)));this.snap[res.k]=mp;}
    this.snap.emails={};(state.emails||[]).forEach(e=>this.snap.emails[e.id]=1);},
  async pull(){
    const startView=view;
    for(const res of SYNC_RES){const rows=await this.api('/'+res.ep);state[res.k]=rows.map(row=>fromApi(res,row));}
    state.galleries.forEach(g=>{g.photoCount=(galleryPhotos[g.id]||[]).length||0;});
    try{const em=await this.api('/emails');state.emails=em.map(e=>({id:e.id,schoolId:e.client_id||'',contactEmail:e.contact_email,direction:e.direction,subject:e.subject,body:e.body,date:e.sent_at||e.created_at,attachments:e.attachments||[]}));}catch(e){}
    try{const me=await this.api('/me');if(me&&me.org){state.studio=me.org.name||state.studio;if(me.org.profile)state.profile=me.org.profile;}}catch(e){}
    state.onboarded=true;ensureDefaults();this.takeSnap();await Store.set(MAIN,state);
    await this.loadIntegrations();
    if(view===startView){view='dashboard';currentSchoolId=null;currentGalleryId=null;}
    if($('#brandName'))$('#brandName').firstChild.textContent=state.studio;
    updateMailBadge();render();updateSyncChip();},
  async push(){
    if(!this.authed||!this.online||this.busy)return;this.busy=true;
    try{
      for(const res of SYNC_RES){const cur={};(state[res.k]||[]).forEach(rec=>cur[rec.id]=rec);const snap=this.snap[res.k]||{};
        for(const id in cur){const body=toApi(res,cur[id]);const s=ser(body);
          if(!(id in snap)){try{await this.api('/'+res.ep,{method:'POST',body:JSON.stringify(body)});}catch(e){try{await this.api('/'+res.ep+'/'+id,{method:'PATCH',body:JSON.stringify(body)});}catch(_){}}snap[id]=s;}
          else if(snap[id]!==s){await this.api('/'+res.ep+'/'+id,{method:'PATCH',body:JSON.stringify(body)});snap[id]=s;}}
        for(const id in snap){if(!(id in cur)){try{await this.api('/'+res.ep+'/'+id,{method:'DELETE'});}catch(e){}delete snap[id];}}
        this.snap[res.k]=snap;}
      const esnap=this.snap.emails||{};
      for(const e of (state.emails||[])){if(!(e.id in esnap)){if(e.direction==='sent'){try{await this.api('/emails/send',{method:'POST',body:JSON.stringify({clientId:e.schoolId||null,to:e.contactEmail,subject:e.subject,body:e.body,attachments:e.attachments||[]})});}catch(err){}}esnap[e.id]=1;}}
      this.snap.emails=esnap;
    }finally{this.busy=false;}},
  async pushLocalAll(){this.snap={};this.snap.emails={};await this.push();},
  async loadIntegrations(){if(!this.authed||!this.online)return;try{const s=await this.api('/integrations/status');
    state.integrations.ai={provider:state.integrations.ai.provider||'anthropic',hasKey:!!(s.ai&&s.ai.hasKey)};
    state.integrations.gmail={connected:!!(s.gmail&&s.gmail.connected),email:(s.gmail&&s.gmail.email)||'',connectedAt:''};
    await Store.set(MAIN,state);}catch(e){}},
  async saveAIKey(provider,key){return this.api('/integrations/ai',{method:'POST',body:JSON.stringify({provider,key})});},
  async gmailConnectUrl(){return this.api('/integrations/gmail/connect');},
  async gmailDisconnect(){return this.api('/integrations/gmail/disconnect',{method:'POST'});},
  gmailInbox(){return this.api('/gmail/messages');},
  async uploadPhotos(galleryId,files){const fd=new FormData();[...files].forEach(f=>fd.append('files',f));const h={};if(this.token)h.Authorization='Bearer '+this.token;
    const r=await fetch(this.base+'/galleries/'+galleryId+'/photos',{method:'POST',headers:h,body:fd});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||('upload HTTP '+r.status));}return r.json();},
  listPhotos(galleryId){return this.api('/galleries/'+galleryId+'/photos');},
  shareGet(id){return this.api('/galleries/'+id+'/share');},
  portalLink(){return this.api('/portal-link');},
  showcaseGet(){return this.api('/showcase');},
  async showcaseMediaStatus(ids){const h={};if(this.token)h.Authorization='Bearer '+this.token;const r=await fetch(this.base+'/showcase/media-status?ids='+encodeURIComponent((ids||[]).join(',')),{headers:h});if(!r.ok)return{};const d=await r.json().catch(()=>({}));return d.statuses||{};},
  showcaseSave(cfg){return this.api('/showcase',{method:'PUT',body:JSON.stringify(cfg)});},

  const paid=state.orders.filter(o=>o.paid).reduce((t,o)=>t+(+o.amount||0),0), out=state.orders.filter(o=>!o.paid).reduce((t,o)=>t+(+o.amount||0),0);

  const openTasks=state.tasks.filter(t=>!t.done).length;

    <div class="stat"><div class="stat-label">Open tasks</div><div class="stat-num">${openTasks}</div><div class="stat-foot ${openTasks?'alert':''}">${openTasks?'to do':'all clear'}</div></div>
    <div class="stat"><div class="stat-label">Collected</div><div class="stat-num"><span class="cur">$</span>${paid.toLocaleString('en-US')}</div><div class="stat-foot">paid orders</div></div>
    <div class="stat"><div class="stat-label">Outstanding</div><div class="stat-num"><span class="cur">$</span>${out.toLocaleString('en-US')}</div><div class="stat-foot ${out?'alert':''}">${out?'awaiting payment':'all collected'}</div></div>

  const insightInner=lastInsights?lastInsights.map((t,i)=>`<div class="ai-insight"><span class="idx">${String(i+1).padStart(2,'0')}</span><span>${esc(t)}</span></div>`).join(''):`<div class="ai-empty">Generate prioritized next steps from your clients, schedule, contracts, tasks and unpaid orders.</div>`;
  return stats+`<div class="two-col"><div>
      <div class="section-head"><h2>Upcoming picture days</h2><div class="rule"></div><span class="count">${up.length}</span></div>

      <div class="sub">PRIORITIZED ACTIONS · POWERED BY CLAUDE</div><div id="insightBox">${insightInner}</div>
      <button class="btn btn-ai btn-sm" id="genInsights" style="margin-top:10px;width:100%;justify-content:center">${lastInsights?'Refresh briefing':'Generate briefing'}</button></div>

function pdRow(p){const f=fmtDate(p.date);return`<div class="row-item" data-pd="${p.id}"><div class="avatar" style="background:var(--safelight)">${f.day}</div><div class="ri-main"><div class="ri-title">${esc(schoolName(p.schoolId))}</div><div class="ri-sub">${f.mon} ${f.day} · ${esc(p.time||'TBD')} · ${esc(p.location||'')}</div></div><span class="pill p-${p.status}"><span class="dot"></span>${p.status}</span></div>`;}
function orderRow(o){return`<div class="row-item" data-order="${o.id}"><div class="avatar">${initials(o.athleteName)}</div><div class="ri-main"><div class="ri-title">${esc(o.athleteName||'—')}</div><div class="ri-sub">${esc(o.package)} · ${esc(schoolName(o.schoolId))}</div></div><div class="ri-right">${money(o.amount)}<br><span class="pill p-${o.paid?'paid':'unpaid'}" style="margin-top:3px"><span class="dot"></span>${o.paid?'paid':'unpaid'}</span></div></div>`;}
function taskList(tasks){if(!tasks.length)return`<div style="padding:18px 16px;text-align:center;color:var(--muted);font-size:13px">No open tasks.</div>`;
  return tasks.map(t=>`<div class="row-item"><input type="checkbox" data-task-toggle="${t.id}" ${t.done?'checked':''} style="width:16px;height:16px;flex:none"><div class="ri-main" data-task-edit="${t.id}"><div class="ri-title" style="${t.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(t.title)}</div><div class="ri-sub">${t.due?fmtDate(t.due).full:'no due date'}${t.schoolId?' · '+esc(schoolName(t.schoolId)):''}</div></div>${t.priority==='high'?'<span class="pill p-unpaid"><span class="dot"></span>high</span>':''}</div>`).join('');}
function wireDashboardAI(){const b=$('#genInsights');if(!b)return;b.onclick=async()=>{const box=$('#insightBox');box.innerHTML=`<div class="gen-state" style="padding:8px 0"><span class="spin"></span>Reading your business…</div>`;b.disabled=true;
  try{const txt=await askOnce("You are the operations advisor inside a sports-photography platform. Return the 3 most important next actions, ranked, each a concise sentence specific to the data (name the client/athlete/amount/task). Return ONLY a JSON array of 3 strings.",dataSummary(),700);
    let arr;try{arr=JSON.parse(txt.replace(/```json|```/g,'').trim());}catch(e){arr=txt.split('\n').filter(Boolean).slice(0,3);}
    lastInsights=Array.isArray(arr)?arr.slice(0,3):[String(arr)];render();
  }catch(e){box.innerHTML=`<div class="ai-empty">AI runs inside the Claude app — open this platform there to generate a live briefing.</div>`;b.disabled=false;aiOffline();}};}

/* ===== Calendar ===== */
function allEvents(){
  const ev=[];
  state.pictureDays.forEach(p=>{if(p.date)ev.push({date:p.date,time:p.time||'',kind:'shoot',done:p.status==='completed'||p.status==='cancelled',label:schoolName(p.schoolId),sub:p.location||'',ref:'pd',id:p.id});});
  state.appointments.forEach(a=>{if(a.date)ev.push({date:a.date,time:a.time||'',kind:a.type||'other',done:a.done,label:a.title,sub:a.schoolId?schoolName(a.schoolId):'',ref:'appt',id:a.id});});
  state.tasks.forEach(t=>{if(t.due)ev.push({date:t.due,time:'',kind:'task',done:t.done,label:t.title,sub:t.schoolId?schoolName(t.schoolId):'',ref:'task',id:t.id});});
  return ev;
}
function evClass(ev){return'ev-'+(ev.kind==='task'?'task':ev.kind==='shoot'?'shoot':ev.kind==='meeting'?'meeting':ev.kind==='call'?'call':'other')+(ev.done?' ev-done':'');}
function evClick(ev){return ev.ref==='pd'?`data-pd="${ev.id}"`:ev.ref==='appt'?`data-appt="${ev.id}"`:`data-task-edit="${ev.id}"`;}
function renderCalendar(){
  const toolbar=`<div class="cal-head"><div class="seg"><button class="${calMode==='day'?'on':''}" data-cmode="day">Day</button><button class="${calMode==='week'?'on':''}" data-cmode="week">Week</button><button class="${calMode==='month'?'on':''}" data-cmode="month">Month</button></div>
    <button class="btn btn-sm" data-cnav="-1">‹</button><div class="cal-title">${calTitle()}</div><button class="btn btn-sm" data-cnav="1">›</button><button class="btn btn-sm" data-cnav="0">Today</button>
    <div class="topbar-spacer"></div><button class="btn btn-sm" data-appt="new">+ Appointment</button><button class="btn btn-sm" id="cal-newtask">+ Task</button></div>`;
  const body=calMode==='month'?calMonth():calMode==='week'?calWeek():calDay();
  const open=state.tasks.filter(t=>!t.done);
  const tasks=`<div class="section-head" style="margin-top:26px"><h2>Tasks</h2><div class="rule"></div><span class="count">${open.length} open</span></div><div class="panel">${taskList(state.tasks.slice().sort((a,b)=>(a.done?1:0)-(b.done?1:0)||((a.due||'9999')> (b.due||'9999')?1:-1)))}</div>`;
  return toolbar+body+tasks;
}
function calTitle(){const c=calCursor;if(calMode==='day')return c.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});if(calMode==='week'){const s=weekStart(c);const e=new Date(s);e.setDate(s.getDate()+6);return s.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' – '+e.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}return c.toLocaleString('en-US',{month:'long',year:'numeric'});}
function weekStart(d){const s=new Date(d);s.setHours(0,0,0,0);s.setDate(s.getDate()-s.getDay());return s;}
function isoOf(d){return d.toISOString().slice(0,10);}
function calMonth(){
  const y=calCursor.getFullYear(),m=calCursor.getMonth();
  const first=new Date(y,m,1),start=first.getDay(),days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate();
  const byDate={};allEvents().forEach(e=>{(byDate[e.date]=byDate[e.date]||[]).push(e);});
  let cells='';
  for(let i=0;i<start;i++)cells+=`<div class="cal-cell dim"><div class="cal-num">${prevDays-start+i+1}</div></div>`;
  for(let dd=1;dd<=days;dd++){
    const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    const evs=(byDate[iso]||[]).sort((a,b)=>(a.time||'').localeCompare(b.time||'')).slice(0,4).map(e=>`<div class="cal-ev ${evClass(e)}" ${evClick(e)} title="${esc(e.label)}">${e.time?e.time+' ':''}${esc(e.label)}</div>`).join('');
    const more=(byDate[iso]||[]).length>4?`<div style="font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:3px">+${(byDate[iso]||[]).length-4} more</div>`:'';
    cells+=`<div class="cal-cell ${iso===todayISO()?'today':''}" data-pd-new="${iso}"><div class="cal-num">${dd}</div>${evs}${more}</div>`;
  }
  return `<div class="cal-grid"><div class="cal-dow">${DOW.map(d=>`<div>${d}</div>`).join('')}</div><div class="cal-body">${cells}</div></div>`;
}
function calWeek(){
  const s=weekStart(calCursor);const byDate={};allEvents().forEach(e=>{(byDate[e.date]=byDate[e.date]||[]).push(e);});
  let cols='';
  for(let i=0;i<7;i++){const d=new Date(s);d.setDate(s.getDate()+i);const iso=isoOf(d);
    const evs=(byDate[iso]||[]).sort((a,b)=>(a.time||'').localeCompare(b.time||'')).map(e=>`<div class="cal-ev ${evClass(e)}" ${evClick(e)} title="${esc(e.label)}">${e.time?e.time+' ':''}${esc(e.label)}</div>`).join('')||`<div style="font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center;padding-top:16px">—</div>`;
    cols+=`<div class="wk-col ${iso===todayISO()?'today':''}" data-pd-new="${iso}"><div class="wk-h">${DOW[d.getDay()]}<b>${d.getDate()}</b></div>${evs}</div>`;
  }
  return `<div class="cal-week">${cols}</div>`;
}
function calDay(){
  const iso=isoOf(calCursor);const evs=allEvents().filter(e=>e.date===iso).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  if(!evs.length)return `<div class="cal-day"><div class="empty" style="padding:50px"><h3>Nothing scheduled</h3><p>Tap to add an appointment for this day.</p><button class="btn btn-primary" data-pd-new="${iso}" >+ New</button></div></div>`;
  return `<div class="cal-day">${evs.map(e=>`<div class="day-ev ${evClass(e)}" ${evClick(e)}><span class="t">${e.time||'all day'}</span><div><div class="lbl">${esc(e.label)}</div>${e.sub?`<div class="ri-sub">${esc(e.sub)}</div>`:''}</div><span class="k">${e.kind}</span></div>`).join('')}</div>`;
}
function wireCalendar(){
  document.querySelectorAll('[data-cmode]').forEach(b=>b.onclick=()=>{calMode=b.dataset.cmode;render();});
  document.querySelectorAll('[data-cnav]').forEach(b=>b.onclick=()=>{const v=+b.dataset.cnav;if(v===0)calCursor=new Date();else{if(calMode==='day')calCursor.setDate(calCursor.getDate()+v);else if(calMode==='week')calCursor.setDate(calCursor.getDate()+7*v);else calCursor.setMonth(calCursor.getMonth()+v);}render();});
  const nt=$('#cal-newtask');if(nt)nt.onclick=()=>openTask();
  const na=document.querySelector('[data-appt="new"]');if(na)na.onclick=()=>openAppointment();
  // event chips inside calendar
  document.querySelectorAll('.cal-ev[data-pd],.day-ev[data-pd]').forEach(n=>n.addEventListener('click',e=>{e.stopPropagation();openPictureDay(n.dataset.pd);}));
  document.querySelectorAll('.cal-ev[data-appt],.day-ev[data-appt]').forEach(n=>n.addEventListener('click',e=>{e.stopPropagation();openAppointment(n.dataset.appt);}));
  document.querySelectorAll('.cal-ev[data-task-edit],.day-ev[data-task-edit]').forEach(n=>n.addEventListener('click',e=>{e.stopPropagation();openTask(n.dataset.taskEdit);}));
}

function athleteRow(a){return`<div class="athlete-row" data-edit-athlete="${a.id}"><span class="jersey">${esc(a.jersey||'—')}</span><span class="ath-name">${esc(a.name)} <span style="font-weight:400;color:var(--muted);font-family:var(--mono);font-size:11px">G${esc(a.grade||'')}</span></span><span class="ath-parent">${esc(a.parentName||'no guardian')} · ${esc(a.parentEmail||'')}</span></div>`;}

function clientDocs(s){

async function ensurePhotos(gid,force){
  if(Sync.authed&&Sync.online){
    try{const list=await Sync.listPhotos(gid);galleryPhotos[gid]=list.map(p=>({id:p.id,name:p.filename,src:(p.thumb||p.url),full:p.url}));return;}catch(e){/* fall back to local cache */}
  }
  if(galleryPhotos[gid]&&!force)return;const p=await Store.get(PKEY(gid));galleryPhotos[gid]=Array.isArray(p)?p:[];
}
function downscale(file){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{const max=1600;let w=img.width,h=img.height;const sc=Math.min(1,max/Math.max(w,h));const cw=Math.round(w*sc),ch=Math.round(h*sc);const c=document.createElement('canvas');c.width=cw;c.height=ch;c.getContext('2d').drawImage(img,0,0,cw,ch);URL.revokeObjectURL(url);try{res(c.toDataURL('image/jpeg',0.82));}catch(e){rej(e);}};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bad image'));};img.src=url;});}
async function handleFiles(fileList){
  const g=galById(currentGalleryId);if(!g)return;const files=[...fileList].filter(f=>f.type.startsWith('image/'));

  if(Sync.authed&&Sync.online){
    try{
      await Sync.uploadPhotos(g.id,files);await ensurePhotos(g.id,true);
      g.photoCount=(galleryPhotos[g.id]||[]).length;if(g.status==='processing')g.status='ready';await save();render();
      toast(`Uploaded ${files.length} to your gallery — visible to everyone in your studio`);return;
    }catch(e){toast('Upload failed ('+(e.message||'')+') — saved on this device');}
  }
  galleryPhotos[g.id]=galleryPhotos[g.id]||[];
  for(const f of files){try{const src=await downscale(f);galleryPhotos[g.id].push({id:uid(),name:f.name,src,full:src});}catch(e){}}
  g.photoCount=galleryPhotos[g.id].length;if(g.status==='processing')g.status='ready';
  const ok=await Store.set(PKEY(g.id),galleryPhotos[g.id]);await save();render();
  toast(ok?`Added ${files.length} photo${files.length>1?'s':''}`:'Added (device storage full — kept for this session only)');
}

let scMediaStatus={}; let scPollTimer=null;
function scStatusText(st){ if(st==='ready')return 'Ready — plays on your page'; if(st==='failed')return 'Couldn’t process — use a video link instead'; if(st==='processing')return 'Processing… (up to a minute)'; if(st==='unknown')return 'Video'; return 'Checking…'; }

function scUpdateStatusDOM(id,st){
  const span=document.querySelector('[data-vst="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]'); if(span)span.textContent=scStatusText(st);
  const tile=document.querySelector('[data-vph="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]'); if(tile){tile.classList.remove('is-processing','is-ready','is-failed');tile.classList.add(scStatusClass(st));}

async function scPollStatus(){
  scPollTimer=null;
  const ids=(((scCfg&&scCfg.items)||[]).filter(x=>x.kind==='video').map(x=>x.id));
  if(!ids.length)return;
  const pending=ids.filter(id=>scMediaStatus[id]!=='ready'&&scMediaStatus[id]!=='failed'&&scMediaStatus[id]!=='unknown');
  const ask=pending.length?pending:ids;
  let st={}; try{ st=await Sync.showcaseMediaStatus(ask); }catch(e){ st={}; }
  let anyPending=false;
  for(const id of Object.keys(st)){
    if(scMediaStatus[id]!==st[id]){ const wasProcessing=scMediaStatus[id]==='processing'; scMediaStatus[id]=st[id]; scUpdateStatusDOM(id,st[id]); if(st[id]==='ready'&&wasProcessing)toast('Your video is ready — now playing on your page.'); }
    if(st[id]==='processing')anyPending=true;
  }
  if(anyPending)scPollTimer=setTimeout(scPollStatus,4000);
}

function scReqRow(x){const isNew=x.status==='new';const dt=x.date?fmtDate(String(x.date).replace(' ','T')).full:'';

function scReply(id){const x=(state.inquiries||[]).find(i=>i.id===id);if(!x||!x.email)return;const sub='Re: your request — '+state.studio;const body='Hi '+(x.name||'')+',\n\nThanks for reaching out!\n\n';location.href='mailto:'+x.email+'?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body);}

function scNum(v,def){if(typeof v==='number'&&isFinite(v))return Math.max(0,Math.min(100,v));const m={left:0,top:0,center:50,right:100,bottom:100};if(v in m)return m[v];const n=parseFloat(v);return isFinite(n)?Math.max(0,Math.min(100,n)):def;}
function scCoverPreview(){
  const box=document.getElementById('sc-cvprev');if(!box)return;
  const gv=id=>{const e=document.getElementById(id);return e?e.value:'';};
  const url=(gv('sc-cover')||'').trim();

function scCoverDragInit(){
  const box=document.getElementById('sc-cvprev');if(!box||box._dragWired)return;box._dragWired=true;
  let drag=false,sx=0,sy=0,px=50,py=50;
  const cur=()=>[Math.max(0,Math.min(100,parseFloat((document.getElementById('sc-cvx')||{}).value)||50)),Math.max(0,Math.min(100,parseFloat((document.getElementById('sc-cvy')||{}).value)||50))];
  const setv=(x,y)=>{x=Math.max(0,Math.min(100,x));y=Math.max(0,Math.min(100,y));const ex=document.getElementById('sc-cvx'),ey=document.getElementById('sc-cvy');if(ex)ex.value=Math.round(x);if(ey)ey.value=Math.round(y);scCoverPreview();};
  box.addEventListener('pointerdown',e=>{const u=(document.getElementById('sc-cover')||{}).value;if(!u)return;drag=true;try{box.setPointerCapture(e.pointerId);}catch(_){}sx=e.clientX;sy=e.clientY;const c=cur();px=c[0];py=c[1];box.style.cursor='grabbing';e.preventDefault();});
  box.addEventListener('pointermove',e=>{if(!drag)return;const r=box.getBoundingClientRect();const dx=(e.clientX-sx)/Math.max(1,r.width)*100;const dy=(e.clientY-sy)/Math.max(1,r.height)*100;setv(px-dx,py-dy);});

function collectShowcase(){

    layout:(g('sc-layout')&&g('sc-layout').value)||cd.layout||'masonry',

    coverPosY:(g('sc-cvy')?Math.max(0,Math.min(100,parseFloat(g('sc-cvy').value)||50)):scNum(cd.coverPosY,50)),
    coverHeight:(g('sc-cvh')&&g('sc-cvh').value)||cd.coverHeight||'medium',

    intro:g('sc-introanim')?g('sc-introanim').checked:(cd.intro!==false),
  };
  return { headline:(g('sc-headline')&&g('sc-headline').value)||'', intro:(g('sc-intro')&&g('sc-intro').value)||'', specialties:(g('sc-specialties')&&g('sc-specialties').value)||'', contactOn:!!(g('sc-contact')&&g('sc-contact').checked), formOn:g('sc-form')?g('sc-form').checked:true, design, items };
}
async function saveShowcase(){

let gmailInboxCache=null, gmailInboxLoading=false;
async function ensureGmailInbox(force){
  if(!(gmailOn()&&Sync.authed&&Sync.online)){renderInboxList();return;}
  if(gmailInboxCache&&!force){renderInboxList();return;}
  gmailInboxLoading=true;renderInboxList();
  try{gmailInboxCache=await Sync.gmailInbox();}catch(e){gmailInboxCache={error:(e&&e.message)||'Could not load inbox'};}

function renderAssistant(){
  const log=chat.length?chat.map(m=>msgEl(m.role,m.content)).join(''):`<div class="msg ai"><div class="who">AI</div><div class="bubble">Hi — I'm your studio assistant. I can see your clients, schedule, galleries, contracts, tasks and orders. Ask me to draft emails, summarize conversations, create notes, generate a contract, schedule something, or answer questions about a client.</div></div>`;
  return `<div class="assistant"><div class="chat-log" id="chatLog">${log}</div>
    <div class="chips"><button class="chip" data-q="What should I follow up on this week? Be specific.">What needs follow-up?</button><button class="chip" data-q="Summarize my conversation history with St. Agnes Academy.">Summarize a client</button><button class="chip" data-q="Summarize all outstanding payments and who to remind.">Outstanding payments</button><button class="chip" data-q="Draft a friendly picture-day reminder for the next upcoming shoot.">Draft a reminder</button></div>
    <div class="composer"><textarea id="chatInput" rows="1" placeholder="Ask about your clients, schedule, billing…"></textarea><button class="send-btn" id="chatSend"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg></button></div></div>`;
}
function msgEl(role,content){return`<div class="msg ${role==='user'?'user':'ai'}"><div class="who">${role==='user'?'YOU':'AI'}</div><div class="bubble">${esc(content)}</div></div>`;}
function wireAssistant(){const inp=$('#chatInput'),send=$('#chatSend'),log=$('#chatLog');if(!inp)return;log.scrollTop=log.scrollHeight;
  const auto=()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,140)+'px';};inp.addEventListener('input',auto);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}});send.onclick=sendChat;
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{inp.value=c.dataset.q;sendChat();});}
async function sendChat(){const inp=$('#chatInput');if(!inp)return;const text=inp.value.trim();if(!text||chatBusy)return;
  chat.push({role:'user',content:text});inp.value='';inp.style.height='auto';chatBusy=true;
  const log=$('#chatLog');log.innerHTML=chat.map(m=>msgEl(m.role,m.content)).join('')+`<div class="msg ai thinking"><div class="who">AI</div><div class="bubble">thinking…</div></div>`;log.scrollTop=log.scrollHeight;
  try{const msgs=chat.slice(-10).map(m=>({role:m.role==='user'?'user':'assistant',content:m.content}));
    const emailCtx=state.emails.slice(0,8).map(e=>`[${e.direction}] ${schoolName(e.schoolId)} "${e.subject}": ${e.body.slice(0,120)}`).join('\n');
    const reply=await callAI({system:`You are the AI assistant inside ${state.studio}, a sports-photography business platform. Be concise, practical and specific to the data. When asked to draft, produce ready-to-send copy. Current data:\n\n${dataSummary()}\n\nRecent emails:\n${emailCtx}`,messages:msgs,max_tokens:1024});
    chat.push({role:'assistant',content:reply});
  }catch(e){chat.push({role:'assistant',content:'⚠︎ AI is unavailable in this environment. Open this platform inside the Claude app and the assistant will work with full access to your data.'});aiOffline();}
  chatBusy=false;if(view==='assistant'){const l=$('#chatLog');l.innerHTML=chat.map(m=>msgEl(m.role,m.content)).join('');l.scrollTop=l.scrollHeight;const i=$('#chatInput');if(i)i.focus();}}

let billingFilter='all';
let billDraft=null;
function billingDocs(){return state.documents.filter(d=>d.type==='Quote'||d.type==='Invoice');}
function billingOf(sid){return billingDocs().filter(d=>d.schoolId===sid);}
function parseBill(d){let b={};try{b=JSON.parse(d.body||'{}');}catch(e){b={};}b.lineItems=Array.isArray(b.lineItems)?b.lineItems:[];return b;}
function billTotal(b){const sub=(b.lineItems||[]).reduce((t,li)=>t+(Number(li.qty)||0)*(Number(li.price)||0),0);const tax=sub*((Number(b.taxRate)||0)/100);return{sub,tax,total:sub+tax};}
function billNumber(kind){return (kind==='Quote'?'QUO':'INV')+'-'+todayISO().replace(/-/g,'')+'-'+uid().slice(0,4).toUpperCase();}
function billTemplates(){return state.templates.filter(t=>t.audience==='Billing');}
function orderInvoice(orderId){return billingDocs().find(d=>parseBill(d).orderId===orderId);}
async function unlockClientGalleries(schoolId){
  if(!schoolId||!(Sync.authed&&Sync.online))return 0;
  const gals=state.galleries.filter(g=>g.schoolId===schoolId);let n=0;
  for(const g of gals){try{await Sync.setDownloads(g.id,true);n++;}catch(e){}}
  return n;
}
// When an invoice is marked paid: unlock the client's galleries, make sure each has a
// live share link, and automatically email the client their receipt + photo download link.
async function onInvoicePaid(d){
  if(!(Sync.authed&&Sync.online))return {ok:false,reason:'offline'};
  const sc=schoolById(d.schoolId)||{};
  let gals=state.galleries.filter(g=>g.schoolId===d.schoolId);
  const withPhotos=gals.filter(g=>(g.photoCount||0)>0);
  if(withPhotos.length)gals=withPhotos;
  const links=[];
  for(const g of gals){
    try{
      await Sync.setDownloads(g.id,true);
      let info=null;
      try{info=await Sync.shareGet(g.id);}catch(e){}
      if(!info||!info.url||info.expired){try{info=await Sync.shareCreate(g.id);}catch(e){}}
      if(info&&info.url)links.push({name:g.name,url:info.url});
    }catch(e){}
  }
  const to=sc.contactEmail||'';
  if(!to)return {ok:true,emailed:false,reason:'noemail',links};
  if(!gmailOn())return {ok:true,emailed:false,reason:'nogmail',links,to};
  const b=parseBill(d);const t=billTotal(b);const num=b.number||'';
  let body='Hi '+(sc.contactName||'')+',\n\nThank you — we\'ve received your payment'+(num?(' for '+num):'')+', and this email is your receipt.\n\n';
  if(b.lineItems&&b.lineItems.length){
    body+=b.lineItems.map(li=>'- '+(li.desc||'')+' — '+(li.qty||0)+' x '+money(li.price||0)+' = '+money((Number(li.qty)||0)*(Number(li.price)||0))).join('\n')+'\nTotal paid: '+money(t.total)+'\n\n';
  }
  if(links.length){
    body+='Your photos are unlocked and ready to download:\n\n'+links.map(l=>l.name+':\n'+l.url+'\nOpen the link and tap "Download all photos" to save them all at once.').join('\n\n')+'\n\n';
  }
  body+='Thank you,\n'+state.studio;
  const subject=(links.length?'Receipt & your photos — ':'Payment receipt — ')+state.studio;
  const localId=uid();
  state.emails.push({id:localId,schoolId:d.schoolId,contactEmail:to,direction:'sent',subject,body,attachments:num?[{type:'invoice',id:d.id,name:num}]:[],date:new Date().toISOString()});
  const res=await sendEmailViaBackend({clientId:d.schoolId,to,subject,body,localId});
  await save();
  return {ok:true,emailed:!!(res&&res.delivered),error:res&&res.error,to,links};
}
function paidToast(r){
  if(!r||r.reason==='offline')return 'Marked paid — sign in to sync to unlock & email the client';
  if(r.emailed)return (r.links&&r.links.length)?'Paid · receipt + photo link emailed to client ✓':'Paid · receipt emailed to client ✓';
  if(r.reason==='noemail')return 'Paid · unlocked (add a client email to auto-send the receipt)';
  if(r.reason==='nogmail')return 'Paid · unlocked (connect Gmail to auto-send the receipt)';
  if(r.error)return 'Paid · unlocked, but the email didn\'t send: '+r.error;
  return 'Paid · photos unlocked for the client';
}

function renderBilling(){

    .p-accepted{background:#E7F0E5;color:#3C5132}.p-accepted .dot{background:var(--olive)}
  `;document.head.appendChild(st);}
  const docs=billingDocs().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const today=todayISO();
  const isOver=d=>{const b=parseBill(d);return d.type==='Invoice'&&d.status!=='paid'&&!!b.dueDate&&b.dueDate<today;};
  const invoices=docs.filter(d=>d.type==='Invoice'),quotes=docs.filter(d=>d.type==='Quote');
  const sum=arr=>arr.reduce((t,d)=>t+billTotal(parseBill(d)).total,0);
  const overdue=invoices.filter(isOver),open=invoices.filter(d=>d.status!=='paid'&&!isOver(d)),paid=invoices.filter(d=>d.status==='paid'),openQ=quotes.filter(d=>d.status!=='accepted');
  const cards=`<div class="bl-sum">`
    +`<div class="bl-card is-over"><div class="lab">Overdue</div><div class="amt">${money(sum(overdue))}</div><div class="sub">${overdue.length} invoice${overdue.length===1?'':'s'}</div></div>`

    +`</div>`;
  const f=billingFilter;
  const tab=(k,label)=>`<button class="${f===k?'on':''}" data-bfilter="${k}">${label}</button>`;

  const match=d=>{if(f==='all')return true;if(f==='Invoice')return d.type==='Invoice';if(f==='Quote')return d.type==='Quote';if(f==='overdue')return isOver(d);if(f==='paid')return d.status==='paid';if(f==='draft')return d.status==='draft';return true;};
  const shown=docs.filter(match);
  const body=shown.length?`<div class="bl-wrap"><div class="bl-scroll"><table class="bl"><thead><tr><th>No.</th><th>Client</th><th>Type</th><th>Issued</th><th>Due</th><th class="r">Amount</th><th>Status</th><th class="r">Actions</th></tr></thead><tbody>${shown.map(d=>billRow(d,isOver(d))).join('')}</tbody></table></div></div>`:emptyBlock('No quotes or invoices yet','Create a quote or invoice to send to a client.','',null);

function wireBilling(){
  document.querySelectorAll('[data-bfilter]').forEach(n=>n.onclick=()=>{billingFilter=n.dataset.bfilter;render();});
  document.querySelectorAll('[data-new-quote]').forEach(n=>n.onclick=()=>openBilling(null,'Quote'));
  document.querySelectorAll('[data-new-invoice]').forEach(n=>n.onclick=()=>openBilling(null,'Invoice'));
  document.querySelectorAll('[data-bill-view]').forEach(n=>n.onclick=()=>printBilling(n.dataset.billView));
  document.querySelectorAll('[data-bill-edit]').forEach(n=>n.onclick=()=>openBilling(n.dataset.billEdit));
  document.querySelectorAll('[data-bill-send]').forEach(n=>n.onclick=()=>sendBilling(n.dataset.billSend));
  document.querySelectorAll('[data-bill-conv]').forEach(n=>n.onclick=()=>convertToInvoice(n.dataset.billConv));

function billRecalc(){
  const rows=[...document.querySelectorAll('.bill-li')];
  billDraft=rows.map(r=>({desc:r.querySelector('.li-desc').value,qty:Number(r.querySelector('.li-qty').value)||0,price:Number(r.querySelector('.li-price').value)||0}));
  rows.forEach(r=>{const q=Number(r.querySelector('.li-qty').value)||0,p=Number(r.querySelector('.li-price').value)||0;r.querySelector('.li-amt').textContent=money(q*p);});
  const taxRate=Number($('#b-tax').value)||0;const t=billTotal({lineItems:billDraft,taxRate});
  $('#b-sub').textContent=money(t.sub);$('#b-taxamt').textContent=money(t.tax);$('#b-total').textContent=money(t.total);
}

function standardContractBody(s){const p=state.profile||{};const pkgs=state.packages.filter(x=>x.name!=='Custom').map(x=>'   \u2022 '+x.name+' \u2014 '+money(x.price)).join('\n')||'   \u2022 (see package list)';
  return `SPORTS PHOTOGRAPHY SERVICES AGREEMENT

This Agreement is made between ${state.studio} ("Photographer") and ${s?s.name:'[Client]'} ("Client") as of ${fmtDate(todayISO()).full}.

1. SCOPE OF SERVICES

4. PACKAGES & PRICING
${pkgs}

5. PAYMENT TERMS
Invoices are due within 30 days of receipt unless otherwise agreed. Online galleries unlock for full-resolution download once payment is complete.

6. CANCELLATION & WEATHER

${state.studio}${p.email?(' \u00b7 '+p.email):''}${p.phone?(' \u00b7 '+p.phone):''}

10. SIGNATURES
Client: __________________________   Date: ____________
${state.studio}: __________________________   Date: ____________`;
}
function renderContracts(){
  const all=contractDocs();const f=contractFilter;
  let docs=f==='all'?all.slice():all.filter(d=>d.status===f);
  docs.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const cnt=s=>all.filter(d=>d.status===s).length;
  const stats=`<div class="stat-grid">
    <div class="stat"><div class="stat-label">Drafts</div><div class="stat-num">${cnt('draft')}</div><div class="stat-sub">not sent yet</div></div>
    <div class="stat"><div class="stat-label">Sent</div><div class="stat-num">${cnt('sent')}</div><div class="stat-sub">awaiting signature</div></div>
    <div class="stat"><div class="stat-label">Signed</div><div class="stat-num">${cnt('signed')}</div><div class="stat-sub">complete</div></div></div>`;
  const head=`<div class="toolbar"><div class="seg"><button class="${f==='all'?'on':''}" data-cfilter="all">All</button><button class="${f==='draft'?'on':''}" data-cfilter="draft">Drafts</button><button class="${f==='sent'?'on':''}" data-cfilter="sent">Sent</button><button class="${f==='signed'?'on':''}" data-cfilter="signed">Signed</button></div><div class="topbar-spacer"></div><button class="btn btn-primary btn-sm" data-new-contract>New contract</button></div>`;
  const rows=docs.length?docs.map(contractRow).join(''):emptyBlock('No contracts yet','Create an agreement for a client — start blank, insert the standard template, or let AI draft it.','',null);
  return stats+head+`<div class="list">${rows}</div>`;
}

async function sendContract(docId){
  const d=state.documents.find(x=>x.id===docId);if(!d)return;
  const sc=schoolById(d.schoolId)||{};const to=sc.contactEmail||'';
  editing=null;$('#mEyebrow').textContent='Send';$('#mEyebrow').className='eyebrow';$('#mTitle').textContent='Send '+(d.type||'document').toLowerCase();$('#modal').classList.remove('wide');
  const subject=d.name+' \u2014 '+state.studio;
  const body='Hi '+(sc.contactName||'')+',\n\nPlease find your '+(d.type||'document').toLowerCase()+' below. Let me know if you have any questions or are ready to sign.\n\n'+(d.body||'(document attached)')+'\n\nThank you,\n'+state.studio;
  $('#mBody').innerHTML=`<div class="field"><label>To</label><input id="sc-to" value="${esc(to)}" placeholder="client@email.com"></div><div class="field"><label>Subject</label><input id="sc-sub" value="${esc(subject)}"></div><div class="field"><label>Message</label><textarea id="sc-body" style="min-height:220px">${esc(body)}</textarea></div>`;
  $('#mDelete').style.display='none';$('#mSave').textContent='Send';$('#mSave').style.display='inline-flex';
  $('#mSave').onclick=async()=>{const t=$('#sc-to').value.trim();if(!t){toast('Add a recipient');return;}const sub=$('#sc-sub').value,bd=$('#sc-body').value;const localId=uid();
    state.emails.push({id:localId,schoolId:d.schoolId,contactEmail:t,direction:'sent',subject:sub,body:bd,date:new Date().toISOString()});
    if(d.status==='draft')d.status='sent';
    const connected=gmailOn()&&Sync.authed&&Sync.online;let res={};
    if(Sync.authed&&Sync.online)res=await sendEmailViaBackend({clientId:d.schoolId,to:t,subject:sub,body:bd,localId});
    await save();
    if(!connected){const href='mailto:'+t+'?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(bd);const a=document.createElement('a');a.href=href;document.body.appendChild(a);a.click();a.remove();}
    closeModal();render();toast(res&&res.delivered?'Contract sent from your Gmail \u2713':(connected?('Gmail didn\'t send: '+(res.error||'')):'Contract \u2014 email opened & logged'));};
  openModal();
}

function exportCSV(){const q=s=>`"${String(s==null?'':s).replace(/"/g,'""')}"`;
  const schools=['Client,District,Contact,Email,Phone,Contract,Value,Renewal,Teams,Athletes,Spent,Outstanding'].concat(state.schools.map(s=>[s.name,s.district,s.contactName,s.contactEmail,s.contactPhone,s.contractStatus,s.contractValue,s.renewal,teamsOf(s.id).length,athletesOfSchool(s.id).length,schoolRevenue(s.id),schoolOutstanding(s.id)].map(q).join(','))).join('\n');
  const roster=['Client,Sport,Season,Athlete,Jersey,Grade,Parent,ParentEmail,ParentPhone'].concat(state.athletes.map(a=>{const t=teamById(a.teamId)||{};return[schoolName(t.schoolId),t.sport,t.season,a.name,a.jersey,a.grade,a.parentName,a.parentEmail,a.parentPhone].map(q).join(',');})).join('\n');

function restoreBackup(file){
  const r=new FileReader();
  r.onload=async()=>{
    let data;try{data=JSON.parse(r.result);}catch(e){toast('That file isn\'t a valid backup');return;}
    const st=data&&data.state?data.state:data;
    if(!st||!Array.isArray(st.schools)){toast('That doesn\'t look like a Frameline backup');return;}
    if(!confirm('Restore this backup? It replaces the data currently in this app on this device'+((Sync.authed&&Sync.online)?' and uploads it to your backend.':'.')))return;
    ['studio','profile','packages','schools','teams','athletes','pictureDays','galleries','orders','appointments','tasks','documents','emails','templates','integrations'].forEach(k=>{if(st[k]!==undefined)state[k]=st[k];});
    ensureDefaults();
    if(data.photos){for(const gid in data.photos){try{await Store.set(PKEY(gid),data.photos[gid]);}catch(e){}galleryPhotos[gid]=data.photos[gid];}}
    await Store.set(MAIN,state);$('#brandName').firstChild.textContent=state.studio;
    if(Sync.authed&&Sync.online){try{await Sync.pushLocalAll();}catch(e){toast('Restored locally — server upload had an issue');}}
    view='dashboard';currentSchoolId=null;currentGalleryId=null;render();updateMailBadge();
    toast('Backup restored');
  };
  r.readAsText(file);
}
</script>
